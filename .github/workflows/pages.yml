name: Deploy HCunion Client to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate client files and menu
        run: |
          set -eu
          test -s index.html
          test -s style.css
          test -s runtime/1.8.8-wasm/index.html
          test -s runtime/1.8.8-wasm/bootstrap.js
          grep -q 'style.css' index.html
          CLIENT=runtime/1.8.8-wasm/index.html
          grep -q 'data-tab="Mods"' "$CLIENT"
          grep -q 'data-tab="Cosmetics"' "$CLIENT"
          grep -q '<h2>Auto Clicker</h2>' "$CLIENT"
          grep -q '<h2>Aim Assist</h2>' "$CLIENT"
          grep -q '<h2>Auto Rod</h2>' "$CLIENT"
          grep -q '<h2>Macro</h2>' "$CLIENT"
          ! grep -q 'data-tab="Home"' "$CLIENT"
          ! grep -q 'data-tab="Settings"' "$CLIENT"
          ! grep -q 'data-tab="Profiles"' "$CLIENT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
