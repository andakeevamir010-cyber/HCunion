name: Deploy EaglercraftX WASM-GC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate launcher
        run: |
          set -eu
          test -s index.html
          test -s runtime/1.8.8-wasm/index.html
          test -s runtime/1.8.8-wasm/bootstrap.js
          grep -q 'runtime/1.8.8-wasm/' index.html
          grep -q 'bootstrap.js' runtime/1.8.8-wasm/index.html
          grep -q 'assetsURI' runtime/1.8.8-wasm/index.html
          for f in config clicker menu init; do test -s "runtime/1.8.8-wasm/hcunion/$f.js"; done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
